<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">NUMU textured contact QR code</title>
  <desc id="desc">A scannable black QR code over a pale mycelium texture background for https://www.numu.bio/connect.</desc>
  <defs>
    <filter id="grainSoft" x="0" y="0" width="100%" height="100%">
      <feColorMatrix type="saturate" values="0.55"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.72" intercept="0.28"/>
        <feFuncG type="linear" slope="0.72" intercept="0.28"/>
        <feFuncB type="linear" slope="0.72" intercept="0.28"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="shade" cx="50%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#EFEAD8" stop-opacity="0.70"/>
      <stop offset="62%" stop-color="#EFEAD8" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#1A1612" stop-opacity="0.16"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="#EFEAD8"/>
  <image
    href="../images/textures/texture_closeup_02.jpg"
    x="-70"
    y="0"
    width="1340"
    height="1200"
    preserveAspectRatio="xMidYMid slice"
    opacity="0.66"
    filter="url(#grainSoft)"
  />
  <rect width="1200" height="1200" fill="url(#shade)"/>

  <g transform="translate(252 188)">
    <rect x="-38" y="-38" width="770" height="770" fill="#EFEAD8" opacity="0.52"/>
    <rect x="-38" y="-38" width="770" height="770" fill="none" stroke="#1A1612" stroke-opacity="0.12" stroke-width="1"/>
    <g transform="scale(18.810811)" shape-rendering="crispEdges">
      <path stroke="#1A1612" stroke-width="1" d="M4 4.5h7m2 0h2m2 0h3m1 0h4m1 0h7M4 5.5h1m5 0h1m6 0h5m2 0h1m1 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m1 0h2m1 0h3m1 0h1m3 0h1m2 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m1 0h3m1 0h1m1 0h2m1 0h1m4 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m1 0h1m2 0h1m3 0h6m1 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m1 0h1m1 0h1m6 0h1m2 0h1m1 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M12 11.5h1m1 0h1m3 0h1m1 0h1m1 0h3M4 12.5h1m1 0h5m2 0h2m5 0h2m1 0h1m2 0h5M4 13.5h1m3 0h2m1 0h2m1 0h1m1 0h4m1 0h3m1 0h4m3 0h1M5 14.5h3m1 0h2m3 0h2m1 0h5m2 0h1m1 0h1M7 15.5h3m1 0h1m5 0h1m1 0h1m2 0h6m1 0h1m1 0h1M4 16.5h1m2 0h1m2 0h1m2 0h1m2 0h1m1 0h2m1 0h1m1 0h1m5 0h2M4 17.5h1m3 0h1m3 0h3m4 0h2m1 0h3m1 0h1m1 0h1m3 0h1M6 18.5h1m2 0h4m1 0h1m1 0h1m7 0h1m2 0h1m1 0h2M6 19.5h2m3 0h2m1 0h3m1 0h1m1 0h1m6 0h2m2 0h1M4 20.5h1m2 0h2m1 0h1m1 0h1m2 0h2m3 0h2m1 0h1m3 0h1m1 0h2M4 21.5h2m2 0h1m6 0h1m1 0h3m2 0h7m1 0h1m1 0h1M4 22.5h1m1 0h1m3 0h2m1 0h2m1 0h7m3 0h2m2 0h1M4 23.5h1m3 0h1m4 0h2m1 0h2m1 0h1m3 0h1m3 0h2m2 0h1M4 24.5h1m2 0h6m2 0h2m1 0h2m1 0h1m2 0h5m1 0h3M12 25.5h2m5 0h2m3 0h1m3 0h5M4 26.5h7m2 0h1m1 0h1m7 0h2m1 0h1m1 0h3M4 27.5h1m5 0h1m1 0h1m3 0h1m1 0h1m1 0h1m1 0h3m3 0h1m2 0h1M4 28.5h1m1 0h3m1 0h1m1 0h1m2 0h2m3 0h1m1 0h1m1 0h5m1 0h1m1 0h1M4 29.5h1m1 0h3m1 0h1m1 0h3m1 0h1m1 0h2m1 0h2m1 0h1m2 0h1m1 0h2M4 30.5h1m1 0h3m1 0h1m1 0h1m2 0h1m1 0h1m1 0h3m1 0h2m1 0h6M4 31.5h1m5 0h1m2 0h1m2 0h4m1 0h2m1 0h1m2 0h1m1 0h1m1 0h1M4 32.5h7m1 0h2m2 0h1m2 0h1m7 0h4"/>
    </g>
  </g>

  <g text-anchor="middle">
    <text x="600" y="933" fill="#1A1612" font-family="Georgia, serif" font-size="86" letter-spacing="0">NUMU</text>
    <text x="600" y="990" fill="#C66A3F" font-family="Arial, sans-serif" font-size="28" letter-spacing="9">SCAN TO CONNECT</text>
    <text x="600" y="1076" fill="#807B70" font-family="Arial, sans-serif" font-size="26" letter-spacing="1">numu.bio/connect</text>
  </g>
</svg>
